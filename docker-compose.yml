# Wathiq — infrastructure skeleton (step 0.6). Only SQL Server for now; api, ollama, seq join in Phase 7.
# Dev on Windows still uses LocalDB (see backend/README.md); this file is for prod parity and for
# anyone without LocalDB. Usage:  docker compose up -d sql   ·   docker compose down -v (wipes data)
name: wathiq

services:
  sql:
    # Express edition is free for production (10 GB / 1 socket), which is all Wathiq needs (Vision P4).
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-14333}:1433"     # 14333 on the host so it never collides with a local SQL Express
    volumes:
      - sql-data:/var/opt/mssql        # named volume: data survives `docker compose down`
    healthcheck:
      # api (Phase 7) will `depends_on: sql: condition: service_healthy`, so the check must be real
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sql-data:
