<!-- Logical properties only (ms-, me-, text-start): this header renders correctly under BOTH
     dir values - the toggle below proves it live, nothing here names left or right. -->
<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
    <span class="inline-flex size-9 items-center justify-center rounded-xl bg-emerald-600 text-lg font-bold text-white">
      و
    </span>
    <div class="text-start">
      <h1 class="text-lg font-semibold text-slate-900">{{ 'shell.appName' | transloco }}</h1>
      <p class="text-xs text-slate-500">{{ 'shell.tagline' | transloco }}</p>
    </div>
    <!-- ms-auto = "push to the END of the reading direction": in ar it lands left, in en right. -->
    <div class="ms-auto flex items-center gap-2">
      @if (auth.isAuthenticated()) {
        <a routerLink="/documents" class="me-2 text-sm font-medium text-emerald-700 hover:underline">
          {{ 'documents.nav' | transloco }}
        </a>
        <a routerLink="/reminders" class="me-2 text-sm font-medium text-emerald-700 hover:underline">
          {{ 'reminders.nav' | transloco }}
        </a>
      }
      @if (auth.isAuthenticated()) {
        <span class="text-sm text-slate-600">{{ auth.userName() }}</span>
        <button
          type="button"
          class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50"
          (click)="auth.logout()"
        >
          {{ 'shell.logout' | transloco }}
        </button>
      } @else {
        <button
          type="button"
          class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700"
          (click)="auth.login()"
        >
          {{ 'shell.login' | transloco }}
        </button>
      }
      <button
        type="button"
        data-testid="lang-toggle"
        class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50"
        (click)="language.toggle()"
      >
        {{ 'shell.switchLang' | transloco }}
      </button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl space-y-8 px-4 py-10">
  <app-document-types-preview></app-document-types-preview>
  <router-outlet></router-outlet>
</main>
